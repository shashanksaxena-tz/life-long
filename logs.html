<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Logs - Life Long</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700&display=swap" rel="stylesheet">
<link rel="stylesheet" href="style.css">
<link rel="manifest" href="manifest.json">
<meta name="theme-color" content="#09090b">
</head>
<body>
<nav>
  <div class="brand">Life Long</div>
  <div class="links">
    <a href="index.html">Dashboard</a>
    <a href="projects.html">Projects</a>
    <a href="tasks.html">Tasks</a>
    <a href="logs.html" class="active">Logs</a>
    <a href="ideas.html">Ideas</a>
    <a href="goals.html">Goals</a>
    <a href="habits.html">Habits</a>
  </div>
</nav>

<div class="container-narrow">
  <div style="display:flex;justify-content:space-between;align-items:center;flex-wrap:wrap;gap:0.5rem">
    <div>
      <h1>Daily Logs</h1>
      <p class="subtitle" id="log-count">Loading logs...</p>
    </div>
    <button class="page-action-btn" onclick="if(window.llShowAddModal)window.llShowAddModal('log')">+ Add Log Entry</button>
  </div>

  <div class="search-bar">
    <input type="text" class="search-input" id="search-input" placeholder="Search logs... (press / to focus)" oninput="filterLogs()">
    <div class="export-bar">
      <button class="export-btn" onclick="exportLogs('json')">JSON</button>
      <button class="export-btn" onclick="exportLogs('csv')">CSV</button>
    </div>
  </div>

  <div id="logs-list">
    <div class="empty-state">Loading...</div>
  </div>
</div>

<script src="utils.js"></script>
<script>
var allLogs = [];

function exportLogs(format) {
  if (format === 'json') {
    LL.exportJSON(allLogs, 'life-long-logs.json');
  } else {
    LL.exportCSV(allLogs, [
      { key: 'date', label: 'Date' },
      { key: 'body', label: 'Content' }
    ], 'life-long-logs.csv');
  }
}

function filterLogs() {
  var query = document.getElementById('search-input').value.trim();
  var filtered = allLogs;
  if (query) {
    filtered = allLogs.filter(function(l) {
      return LL.matchesSearch(l, query, ['date', 'body']);
    });
  }
  renderLogs(filtered);
}

function renderLogs(logs) {
  var list = document.getElementById('logs-list');
  if (logs.length === 0) {
    list.innerHTML = '<div class="empty-state">No logs match your search.</div>';
    return;
  }

  list.innerHTML = logs.map(function(log) {
    var summary = '';
    if (log.body) {
      var firstLine = log.body.split('\n').find(function(l) { return l.trim() !== ''; });
      if (firstLine) {
        summary = firstLine.replace(/^#+\s*/, '').substring(0, 100);
      }
    }
    return '<div class="log-entry">' +
      '<div class="log-header">' +
        '<div>' +
          '<div class="log-date">' + LL.formatDateLong(log.date) + '</div>' +
          (summary ? '<div class="log-day">' + LL.getDayOfWeek(log.date) + '</div>' : '') +
        '</div>' +
      '</div>' +
      '<div class="log-body">' + LL.renderMarkdown(log.body) + '</div>' +
    '</div>';
  }).join('');
}

async function loadLogs() {
  try {
    var res = await fetch('data/index.json');
    var data = await res.json();
    allLogs = data.logs || [];

    allLogs.sort(function(a, b) { return new Date(b.date) - new Date(a.date); });

    document.getElementById('log-count').textContent = allLogs.length + ' log entr' + (allLogs.length !== 1 ? 'ies' : 'y');

    renderLogs(allLogs);
  } catch (err) {
    document.getElementById('logs-list').innerHTML = '<div class="empty-state" style="color:var(--accent-red)">Failed to load data. Make sure data/index.json exists.</div>';
    console.error('Failed to load logs:', err);
  }
}

loadLogs();
</script>
<script src="app.js"></script>
</body>
</html>
