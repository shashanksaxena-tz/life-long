name: Aggregate Data

on:
  push:
    branches: [claude/design-github-system-RCORX]
    paths:
      - 'projects/**'
      - 'tasks/**'
      - 'logs/**'
      - 'ideas/**'

  workflow_dispatch:

permissions:
  contents: write

jobs:
  aggregate:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.12'

      - name: Run aggregation
        run: python scripts/aggregate.py

      - name: Commit updated index.json
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          git add data/index.json
          git diff --cached --quiet || git commit -m "chore: update data/index.json [auto]"
          git push
