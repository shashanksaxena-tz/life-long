name: Create Task
description: Create a new task in a project
title: "Create Task: "
labels: ["input"]
body:
  - type: input
    id: title
    attributes:
      label: Task Title
      placeholder: e.g. Fix OAuth redirect bug
    validations:
      required: true
  - type: input
    id: project
    attributes:
      label: Project
      description: Project ID (slug) this task belongs to
      placeholder: e.g. auth-service
    validations:
      required: true
  - type: dropdown
    id: priority
    attributes:
      label: Priority
      description: Task priority level
      options:
        - ""
        - low
        - medium
        - high
        - critical
  - type: input
    id: due-date
    attributes:
      label: Due Date
      description: Optional due date (YYYY-MM-DD format)
      placeholder: e.g. 2026-03-01
  - type: input
    id: tags
    attributes:
      label: Tags
      description: Comma-separated tags
      placeholder: e.g. bug, backend
  - type: textarea
    id: description
    attributes:
      label: Description
      placeholder: What needs to be done?
