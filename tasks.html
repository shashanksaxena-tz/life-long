<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Tasks - Life Long</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700&display=swap" rel="stylesheet">
<link rel="stylesheet" href="style.css">
<link rel="manifest" href="manifest.json">
<meta name="theme-color" content="#09090b">
</head>
<body>
<nav>
  <div class="brand">Life Long</div>
  <div class="links">
    <a href="index.html">Dashboard</a>
    <a href="projects.html">Projects</a>
    <a href="tasks.html" class="active">Tasks</a>
    <a href="logs.html">Logs</a>
    <a href="ideas.html">Ideas</a>
    <a href="goals.html">Goals</a>
    <a href="habits.html">Habits</a>
  </div>
</nav>

<div class="container">
  <div style="display:flex;justify-content:space-between;align-items:center;flex-wrap:wrap;gap:0.5rem">
    <div>
      <h1>Tasks</h1>
      <p class="subtitle" id="task-count">Loading tasks...</p>
    </div>
    <div style="display:flex;gap:0.75rem;align-items:center;flex-wrap:wrap">
    <button class="page-action-btn" onclick="if(window.llShowAddModal)window.llShowAddModal('task')">+ Add Task</button>
    <button class="page-action-btn secondary" onclick="if(window.llShowAddModal)window.llShowAddModal('update')">Update Task</button>
    <div class="view-toggle" id="view-toggle">
      <button class="view-toggle-btn active" data-view="list" onclick="setView('list')">List</button>
      <button class="view-toggle-btn" data-view="kanban" onclick="setView('kanban')">Kanban</button>
    </div>
    </div>
  </div>

  <div class="search-bar">
    <input type="text" class="search-input" id="search-input" placeholder="Search tasks... (press / to focus)" oninput="applyFilters()">
    <div class="export-bar">
      <button class="export-btn" onclick="exportTasks('json')">JSON</button>
      <button class="export-btn" onclick="exportTasks('csv')">CSV</button>
    </div>
  </div>

  <div class="filters" id="status-filters"></div>

  <div class="filters">
    <div class="filter-row">
      <label>Project:</label>
      <select class="filter-select" id="project-filter" onchange="applyFilters()">
        <option value="all">All Projects</option>
      </select>
    </div>
    <div class="filter-row">
      <label>Tag:</label>
      <select class="filter-select" id="tag-filter" onchange="applyFilters()">
        <option value="all">All Tags</option>
      </select>
    </div>
    <div class="filter-row">
      <label>Priority:</label>
      <select class="filter-select" id="priority-filter" onchange="applyFilters()">
        <option value="all">All Priorities</option>
        <option value="critical">Critical</option>
        <option value="high">High</option>
        <option value="medium">Medium</option>
        <option value="low">Low</option>
      </select>
    </div>
  </div>

  <div class="sort-bar" id="sort-bar">
    <span style="font-size:0.85rem;color:var(--text-muted)">Sort by:</span>
    <button class="sort-btn active" data-sort="updated" onclick="setSort('updated')">Updated</button>
    <button class="sort-btn" data-sort="created" onclick="setSort('created')">Created</button>
    <button class="sort-btn" data-sort="title" onclick="setSort('title')">Title</button>
    <button class="sort-btn" data-sort="priority" onclick="setSort('priority')">Priority</button>
    <button class="sort-btn" data-sort="due" onclick="setSort('due')">Due Date</button>
  </div>

  <div id="tasks-list">
    <div class="empty-state">Loading...</div>
  </div>

  <div id="kanban-view" style="display:none">
    <div class="kanban-board">
      <div class="kanban-column" data-status="todo">
        <div class="kanban-column-header">Todo <span class="count" id="kanban-todo-count">0</span></div>
        <div class="kanban-column-body" id="kanban-todo"></div>
      </div>
      <div class="kanban-column" data-status="in-progress">
        <div class="kanban-column-header">In Progress <span class="count" id="kanban-ip-count">0</span></div>
        <div class="kanban-column-body" id="kanban-in-progress"></div>
      </div>
      <div class="kanban-column" data-status="done">
        <div class="kanban-column-header">Done <span class="count" id="kanban-done-count">0</span></div>
        <div class="kanban-column-body" id="kanban-done"></div>
      </div>
    </div>
  </div>

  <div id="dep-graph-section" style="display:none;margin-top:2rem">
    <div class="section-header">
      <h2>Dependency Graph</h2>
      <span style="font-size:0.85rem;color:var(--text-muted)">Blocked tasks</span>
    </div>
    <div id="dep-graph" class="dep-graph-container"></div>
  </div>
</div>

<script src="utils.js"></script>
<script>
var allTasks = [];
var currentStatusFilter = 'all';
var currentSort = 'updated';
var sortAsc = false;
var currentView = 'list';
var priorityOrder = { critical: 0, high: 1, medium: 2, low: 3 };

function exportTasks(format) {
  if (format === 'json') LL.exportJSON(allTasks, 'life-long-tasks.json');
  else LL.exportCSV(allTasks, [
    { key: 'id', label: 'ID' }, { key: 'title', label: 'Title' }, { key: 'project', label: 'Project' },
    { key: 'status', label: 'Status' }, { key: 'priority', label: 'Priority' }, { key: 'due', label: 'Due Date' },
    { key: 'tags', label: 'Tags' }, { key: 'created', label: 'Created' }, { key: 'updated', label: 'Updated' }
  ], 'life-long-tasks.csv');
}

function setView(view) {
  currentView = view;
  document.querySelectorAll('#view-toggle .view-toggle-btn').forEach(function(btn) {
    btn.classList.toggle('active', btn.dataset.view === view);
  });
  document.getElementById('tasks-list').style.display = view === 'list' ? '' : 'none';
  document.getElementById('kanban-view').style.display = view === 'kanban' ? '' : 'none';
  document.getElementById('sort-bar').style.display = view === 'list' ? '' : 'none';
  if (view === 'kanban') renderKanban();
}

function setSort(field) {
  if (currentSort === field) sortAsc = !sortAsc;
  else { currentSort = field; sortAsc = false; }
  document.querySelectorAll('.sort-btn').forEach(function(btn) { btn.classList.toggle('active', btn.dataset.sort === field); });
  applyFilters();
}

function getFilteredTasks() {
  var statusFilter = currentStatusFilter;
  var projectFilter = document.getElementById('project-filter').value;
  var tagFilter = document.getElementById('tag-filter').value;
  var priorityFilter = document.getElementById('priority-filter').value;
  var searchQuery = document.getElementById('search-input').value.trim();

  return allTasks.filter(function(t) {
    if (statusFilter !== 'all' && (t.status || '').toLowerCase().replace(/\s+/g, '-') !== statusFilter) return false;
    if (projectFilter !== 'all' && t.project !== projectFilter) return false;
    if (tagFilter !== 'all' && (t.tags || []).indexOf(tagFilter) === -1) return false;
    if (priorityFilter !== 'all' && (t.priority || '').toLowerCase() !== priorityFilter) return false;
    if (searchQuery && !LL.matchesSearch(t, searchQuery, ['title', 'id', 'project', 'tags', 'body', 'status'])) return false;
    return true;
  });
}

function applyFilters() {
  var filtered = getFilteredTasks();

  filtered.sort(function(a, b) {
    var valA, valB;
    if (currentSort === 'title') {
      valA = (a.title || '').toLowerCase(); valB = (b.title || '').toLowerCase();
      return sortAsc ? valA.localeCompare(valB) : valB.localeCompare(valA);
    } else if (currentSort === 'priority') {
      valA = priorityOrder[((a.priority || 'low')).toLowerCase()] || 3;
      valB = priorityOrder[((b.priority || 'low')).toLowerCase()] || 3;
      return sortAsc ? valB - valA : valA - valB;
    } else if (currentSort === 'due') {
      valA = a.due ? new Date(a.due) : new Date('9999-12-31');
      valB = b.due ? new Date(b.due) : new Date('9999-12-31');
      return sortAsc ? valB - valA : valA - valB;
    } else {
      valA = new Date(a[currentSort] || a.created || 0);
      valB = new Date(b[currentSort] || b.created || 0);
      return sortAsc ? valA - valB : valB - valA;
    }
  });

  renderTasks(filtered);
  if (currentView === 'kanban') renderKanban();
}

function setStatusFilter(filter) {
  currentStatusFilter = filter;
  document.querySelectorAll('#status-filters .filter-btn').forEach(function(btn) { btn.classList.toggle('active', btn.dataset.filter === filter); });
  applyFilters();
}

function toggleTaskBody(el) {
  var body = el.querySelector('.task-body');
  if (body) body.classList.toggle('open');
}

function renderTasks(tasks) {
  var list = document.getElementById('tasks-list');
  if (tasks.length === 0) { list.innerHTML = '<div class="empty-state">No tasks match the current filters.</div>'; return; }

  list.innerHTML = tasks.map(function(t) {
    var tags = (t.tags || []).map(function(tag) { return '<span class="tag">' + tag + '</span>'; }).join('');
    var hasBody = t.body && t.body.trim();
    var dueClass = t.due ? LL.dueDateClass(t.due) : '';
    var cardClass = 'task-card';
    if (hasBody) cardClass += ' clickable';
    if (t.status !== 'done' && dueClass === 'overdue') cardClass += ' overdue';
    else if (t.status !== 'done' && dueClass === 'due-soon') cardClass += ' due-soon';

    return '<div class="' + cardClass + '"' + (hasBody ? ' onclick="toggleTaskBody(this)"' : '') + '>' +
      '<div class="task-title">' + (t.title || t.id) + '</div>' +
      '<div class="task-meta">' +
        '<span class="badge ' + LL.badgeClass(t.status) + '">' + (t.status || 'todo') + '</span>' +
        (t.priority ? '<span class="badge ' + LL.priorityBadgeClass(t.priority) + '">' + t.priority + '</span>' : '') +
        (t.project ? '<span>Project: <a href="projects.html" onclick="event.stopPropagation()">' + t.project + '</a></span>' : '') +
        (t.due && t.status !== 'done' ? '<span class="task-due ' + dueClass + '">' + LL.relativeDate(t.due) + '</span>' : '') +
        (t.time_spent ? '<span class="time-badge">' + t.time_spent + '</span>' : '') +
        (t.blocked_by ? '<span class="dep-badge">blocked by ' + t.blocked_by + '</span>' : '') +
        '<span data-relative-time="' + (t.updated || t.created) + '">' + LL.formatDate(t.updated || t.created) + '</span>' +
      '</div>' +
      (tags ? '<div class="task-tags">' + tags + '</div>' : '') +
      (hasBody ? '<div class="task-body">' + LL.renderMarkdown(t.body) + '</div>' : '') +
      (window.llTaskActions ? window.llTaskActions(t.id) : '') +
    '</div>';
  }).join('');
}

function renderKanban() {
  var filtered = getFilteredTasks();
  var columns = { todo: [], 'in-progress': [], done: [] };
  filtered.forEach(function(t) {
    var s = (t.status || 'todo').toLowerCase().replace(/\s+/g, '-');
    if (columns[s]) columns[s].push(t);
    else columns.todo.push(t);
  });

  ['todo', 'in-progress', 'done'].forEach(function(status) {
    var container = document.getElementById('kanban-' + status);
    var countEl = document.getElementById('kanban-' + (status === 'in-progress' ? 'ip' : status) + '-count');
    if (countEl) countEl.textContent = columns[status].length;

    container.innerHTML = columns[status].map(function(t) {
      var dueClass = t.due && t.status !== 'done' ? LL.dueDateClass(t.due) : '';
      var cardClass = 'kanban-card';
      if (dueClass === 'overdue') cardClass += ' overdue';
      else if (dueClass === 'due-soon') cardClass += ' due-soon';

      return '<div class="' + cardClass + '" draggable="true" data-task-id="' + t.id + '">' +
        '<div class="kc-title">' + (t.title || t.id) + '</div>' +
        '<div class="kc-meta">' +
          (t.priority ? '<span class="badge ' + LL.priorityBadgeClass(t.priority) + '">' + t.priority + '</span>' : '') +
          (t.project ? '<span>' + t.project + '</span>' : '') +
          (t.due && t.status !== 'done' ? '<span class="task-due ' + dueClass + '">' + LL.relativeDate(t.due) + '</span>' : '') +
        '</div>' +
      '</div>';
    }).join('');

    // Drag events on cards
    container.querySelectorAll('.kanban-card').forEach(function(card) {
      card.addEventListener('dragstart', function(e) {
        e.dataTransfer.setData('text/plain', card.dataset.taskId);
        card.classList.add('dragging');
      });
      card.addEventListener('dragend', function() { card.classList.remove('dragging'); });
    });

    // Drop zone events
    container.addEventListener('dragover', function(e) { e.preventDefault(); container.classList.add('drag-over'); });
    container.addEventListener('dragleave', function() { container.classList.remove('drag-over'); });
    container.addEventListener('drop', function(e) {
      e.preventDefault();
      container.classList.remove('drag-over');
      var taskId = e.dataTransfer.getData('text/plain');
      // Visual move only (actual update requires GitHub issue)
      var task = allTasks.find(function(t) { return t.id === taskId; });
      if (task) {
        task.status = status;
        applyFilters();
      }
    });
  });
}

async function loadTasks() {
  try {
    var res = await fetch('data/index.json');
    var data = await res.json();
    allTasks = data.tasks || [];

    document.getElementById('task-count').textContent = allTasks.length + ' task' + (allTasks.length !== 1 ? 's' : '');

    var statuses = {};
    allTasks.forEach(function(t) {
      var s = (t.status || 'todo').toLowerCase().replace(/\s+/g, '-');
      statuses[s] = (statuses[s] || 0) + 1;
    });
    var filtersHtml = '<button class="filter-btn active" data-filter="all" onclick="setStatusFilter(\'all\')">All (' + allTasks.length + ')</button>';
    Object.keys(statuses).forEach(function(s) {
      var label = s.replace(/-/g, ' ');
      label = label.charAt(0).toUpperCase() + label.slice(1);
      filtersHtml += '<button class="filter-btn" data-filter="' + s + '" onclick="setStatusFilter(\'' + s + '\')">' + label + ' (' + statuses[s] + ')</button>';
    });
    document.getElementById('status-filters').innerHTML = filtersHtml;

    var projects = {};
    allTasks.forEach(function(t) { if (t.project) projects[t.project] = true; });
    var projSelect = document.getElementById('project-filter');
    Object.keys(projects).sort().forEach(function(p) {
      var opt = document.createElement('option'); opt.value = p; opt.textContent = p; projSelect.appendChild(opt);
    });

    var tags = {};
    allTasks.forEach(function(t) { (t.tags || []).forEach(function(tag) { tags[tag] = true; }); });
    var tagSelect = document.getElementById('tag-filter');
    Object.keys(tags).sort().forEach(function(tag) {
      var opt = document.createElement('option'); opt.value = tag; opt.textContent = tag; tagSelect.appendChild(opt);
    });

    applyFilters();
    renderDepGraph();
  } catch (err) {
    document.getElementById('tasks-list').innerHTML = '<div class="empty-state" style="color:var(--accent-red)">Failed to load data.</div>';
    console.error('Failed to load tasks:', err);
  }
}

function renderDepGraph() {
  var blockedTasks = allTasks.filter(function(t) { return t.blocked_by; });
  var section = document.getElementById('dep-graph-section');
  if (blockedTasks.length === 0) { section.style.display = 'none'; return; }
  section.style.display = '';
  var container = document.getElementById('dep-graph');

  var html = '';
  blockedTasks.forEach(function(blocked) {
    var blockerId = blocked.blocked_by;
    var blocker = allTasks.find(function(t) { return t.id === blockerId; });
    var blockerTitle = blocker ? (blocker.title || blocker.id) : blockerId;
    var blockerStatus = blocker ? blocker.status : 'unknown';
    var blockedStatus = blocked.status;

    html += '<div class="dep-graph-row">' +
      '<div class="dep-node ' + (blockerStatus === 'done' ? 'dep-done' : 'dep-pending') + '">' +
        '<div class="dep-node-title">' + blockerTitle + '</div>' +
        '<span class="badge ' + LL.badgeClass(blockerStatus) + '">' + blockerStatus + '</span>' +
      '</div>' +
      '<div class="dep-arrow">' +
        '<svg width="40" height="24" viewBox="0 0 40 24"><path d="M0 12 L30 12 M24 6 L30 12 L24 18" stroke="var(--text-muted)" stroke-width="2" fill="none" stroke-linecap="round" stroke-linejoin="round"/></svg>' +
        '<span class="dep-arrow-label">blocks</span>' +
      '</div>' +
      '<div class="dep-node ' + (blockedStatus === 'done' ? 'dep-done' : 'dep-blocked') + '">' +
        '<div class="dep-node-title">' + (blocked.title || blocked.id) + '</div>' +
        '<span class="badge ' + LL.badgeClass(blockedStatus) + '">' + blockedStatus + '</span>' +
      '</div>' +
    '</div>';
  });

  container.innerHTML = html;
}

loadTasks();
</script>
<script src="app.js"></script>
</body>
</html>
