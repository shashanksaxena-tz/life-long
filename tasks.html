<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Tasks - Life Long</title>
<link rel="stylesheet" href="style.css">
<link rel="manifest" href="manifest.json">
<meta name="theme-color" content="#0d1117">
</head>
<body>
<nav>
  <div class="brand">Life Long</div>
  <div class="links">
    <a href="index.html">Dashboard</a>
    <a href="projects.html">Projects</a>
    <a href="tasks.html" class="active">Tasks</a>
    <a href="logs.html">Logs</a>
    <a href="ideas.html">Ideas</a>
  </div>
</nav>

<div class="container">
  <h1>Tasks</h1>
  <p class="subtitle" id="task-count">Loading tasks...</p>

  <div class="search-bar">
    <input type="text" class="search-input" id="search-input" placeholder="Search tasks... (press / to focus)" oninput="applyFilters()">
    <div class="export-bar">
      <button class="export-btn" onclick="exportTasks('json')">JSON</button>
      <button class="export-btn" onclick="exportTasks('csv')">CSV</button>
    </div>
  </div>

  <div class="filters" id="status-filters"></div>

  <div class="filters">
    <div class="filter-row">
      <label>Project:</label>
      <select class="filter-select" id="project-filter" onchange="applyFilters()">
        <option value="all">All Projects</option>
      </select>
    </div>
    <div class="filter-row">
      <label>Tag:</label>
      <select class="filter-select" id="tag-filter" onchange="applyFilters()">
        <option value="all">All Tags</option>
      </select>
    </div>
    <div class="filter-row">
      <label>Priority:</label>
      <select class="filter-select" id="priority-filter" onchange="applyFilters()">
        <option value="all">All Priorities</option>
        <option value="critical">Critical</option>
        <option value="high">High</option>
        <option value="medium">Medium</option>
        <option value="low">Low</option>
      </select>
    </div>
  </div>

  <div class="sort-bar">
    <span style="font-size:0.85rem;color:#8b949e">Sort by:</span>
    <button class="sort-btn active" data-sort="updated" onclick="setSort('updated')">Updated</button>
    <button class="sort-btn" data-sort="created" onclick="setSort('created')">Created</button>
    <button class="sort-btn" data-sort="title" onclick="setSort('title')">Title</button>
    <button class="sort-btn" data-sort="priority" onclick="setSort('priority')">Priority</button>
    <button class="sort-btn" data-sort="due" onclick="setSort('due')">Due Date</button>
  </div>

  <div id="tasks-list">
    <div class="empty-state">Loading...</div>
  </div>
</div>

<script src="utils.js"></script>
<script>
var allTasks = [];
var currentStatusFilter = 'all';
var currentSort = 'updated';
var sortAsc = false;

var priorityOrder = { critical: 0, high: 1, medium: 2, low: 3 };

function exportTasks(format) {
  if (format === 'json') {
    LL.exportJSON(allTasks, 'life-long-tasks.json');
  } else {
    LL.exportCSV(allTasks, [
      { key: 'id', label: 'ID' },
      { key: 'title', label: 'Title' },
      { key: 'project', label: 'Project' },
      { key: 'status', label: 'Status' },
      { key: 'priority', label: 'Priority' },
      { key: 'due', label: 'Due Date' },
      { key: 'tags', label: 'Tags' },
      { key: 'created', label: 'Created' },
      { key: 'updated', label: 'Updated' }
    ], 'life-long-tasks.csv');
  }
}

function setSort(field) {
  if (currentSort === field) {
    sortAsc = !sortAsc;
  } else {
    currentSort = field;
    sortAsc = false;
  }
  document.querySelectorAll('.sort-btn').forEach(function(btn) {
    btn.classList.toggle('active', btn.dataset.sort === field);
  });
  applyFilters();
}

function applyFilters() {
  var statusFilter = currentStatusFilter;
  var projectFilter = document.getElementById('project-filter').value;
  var tagFilter = document.getElementById('tag-filter').value;
  var priorityFilter = document.getElementById('priority-filter').value;
  var searchQuery = document.getElementById('search-input').value.trim();

  var filtered = allTasks.filter(function(t) {
    if (statusFilter !== 'all' && (t.status || '').toLowerCase().replace(/\s+/g, '-') !== statusFilter) return false;
    if (projectFilter !== 'all' && t.project !== projectFilter) return false;
    if (tagFilter !== 'all' && (t.tags || []).indexOf(tagFilter) === -1) return false;
    if (priorityFilter !== 'all' && (t.priority || '').toLowerCase() !== priorityFilter) return false;
    if (searchQuery && !LL.matchesSearch(t, searchQuery, ['title', 'id', 'project', 'tags', 'body', 'status'])) return false;
    return true;
  });

  filtered.sort(function(a, b) {
    var valA, valB;
    if (currentSort === 'title') {
      valA = (a.title || '').toLowerCase();
      valB = (b.title || '').toLowerCase();
      return sortAsc ? valA.localeCompare(valB) : valB.localeCompare(valA);
    } else if (currentSort === 'priority') {
      valA = priorityOrder[((a.priority || 'low')).toLowerCase()] || 3;
      valB = priorityOrder[((b.priority || 'low')).toLowerCase()] || 3;
      return sortAsc ? valB - valA : valA - valB;
    } else if (currentSort === 'due') {
      valA = a.due ? new Date(a.due) : new Date('9999-12-31');
      valB = b.due ? new Date(b.due) : new Date('9999-12-31');
      return sortAsc ? valB - valA : valA - valB;
    } else {
      valA = new Date(a[currentSort] || a.created || 0);
      valB = new Date(b[currentSort] || b.created || 0);
      return sortAsc ? valA - valB : valB - valA;
    }
  });

  renderTasks(filtered);
}

function setStatusFilter(filter) {
  currentStatusFilter = filter;
  document.querySelectorAll('#status-filters .filter-btn').forEach(function(btn) {
    btn.classList.toggle('active', btn.dataset.filter === filter);
  });
  applyFilters();
}

function toggleTaskBody(el) {
  var body = el.querySelector('.task-body');
  if (body) body.classList.toggle('open');
}

function renderTasks(tasks) {
  var list = document.getElementById('tasks-list');
  if (tasks.length === 0) {
    list.innerHTML = '<div class="empty-state">No tasks match the current filters.</div>';
    return;
  }

  list.innerHTML = tasks.map(function(t) {
    var tags = (t.tags || []).map(function(tag) { return '<span class="tag">' + tag + '</span>'; }).join('');
    var hasBody = t.body && t.body.trim();
    var dueClass = t.due ? LL.dueDateClass(t.due) : '';
    var cardClass = 'task-card';
    if (hasBody) cardClass += ' clickable';
    if (t.status !== 'done' && dueClass === 'overdue') cardClass += ' overdue';
    else if (t.status !== 'done' && dueClass === 'due-soon') cardClass += ' due-soon';

    return '<div class="' + cardClass + '"' + (hasBody ? ' onclick="toggleTaskBody(this)"' : '') + '>' +
      '<div class="task-title">' + (t.title || t.id) + '</div>' +
      '<div class="task-meta">' +
        '<span class="badge ' + LL.badgeClass(t.status) + '">' + (t.status || 'todo') + '</span>' +
        (t.priority ? '<span class="badge ' + LL.priorityBadgeClass(t.priority) + '">' + t.priority + '</span>' : '') +
        (t.project ? '<span>Project: <a href="projects.html" onclick="event.stopPropagation()">' + t.project + '</a></span>' : '') +
        (t.due && t.status !== 'done' ? '<span class="task-due ' + dueClass + '">' + LL.relativeDate(t.due) + '</span>' : '') +
        '<span>Updated ' + LL.formatDate(t.updated || t.created) + '</span>' +
      '</div>' +
      (tags ? '<div class="task-tags">' + tags + '</div>' : '') +
      (hasBody ? '<div class="task-body">' + t.body + '</div>' : '') +
    '</div>';
  }).join('');
}

async function loadTasks() {
  try {
    var res = await fetch('data/index.json');
    var data = await res.json();
    allTasks = data.tasks || [];

    document.getElementById('task-count').textContent = allTasks.length + ' task' + (allTasks.length !== 1 ? 's' : '');

    // Build status filters
    var statuses = {};
    allTasks.forEach(function(t) {
      var s = (t.status || 'todo').toLowerCase().replace(/\s+/g, '-');
      statuses[s] = (statuses[s] || 0) + 1;
    });
    var filtersHtml = '<button class="filter-btn active" data-filter="all" onclick="setStatusFilter(\'all\')">All (' + allTasks.length + ')</button>';
    Object.keys(statuses).forEach(function(s) {
      var label = s.replace(/-/g, ' ');
      label = label.charAt(0).toUpperCase() + label.slice(1);
      filtersHtml += '<button class="filter-btn" data-filter="' + s + '" onclick="setStatusFilter(\'' + s + '\')">' + label + ' (' + statuses[s] + ')</button>';
    });
    document.getElementById('status-filters').innerHTML = filtersHtml;

    // Build project filter dropdown
    var projects = {};
    allTasks.forEach(function(t) { if (t.project) projects[t.project] = true; });
    var projSelect = document.getElementById('project-filter');
    Object.keys(projects).sort().forEach(function(p) {
      var opt = document.createElement('option');
      opt.value = p;
      opt.textContent = p;
      projSelect.appendChild(opt);
    });

    // Build tag filter dropdown
    var tags = {};
    allTasks.forEach(function(t) { (t.tags || []).forEach(function(tag) { tags[tag] = true; }); });
    var tagSelect = document.getElementById('tag-filter');
    Object.keys(tags).sort().forEach(function(tag) {
      var opt = document.createElement('option');
      opt.value = tag;
      opt.textContent = tag;
      tagSelect.appendChild(opt);
    });

    applyFilters();
  } catch (err) {
    document.getElementById('tasks-list').innerHTML = '<div class="empty-state" style="color:#f85149">Failed to load data. Make sure data/index.json exists.</div>';
    console.error('Failed to load tasks:', err);
  }
}

loadTasks();
</script>
<script src="app.js"></script>
</body>
</html>
