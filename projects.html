<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Projects - Life Long</title>
<link rel="stylesheet" href="style.css">
<link rel="manifest" href="manifest.json">
<meta name="theme-color" content="#0d1117">
</head>
<body>
<nav>
  <div class="brand">Life Long</div>
  <div class="links">
    <a href="index.html">Dashboard</a>
    <a href="projects.html" class="active">Projects</a>
    <a href="tasks.html">Tasks</a>
    <a href="logs.html">Logs</a>
    <a href="ideas.html">Ideas</a>
  </div>
</nav>

<div class="container">
  <h1>Projects</h1>
  <p class="subtitle" id="project-count">Loading projects...</p>

  <div class="search-bar">
    <input type="text" class="search-input" id="search-input" placeholder="Search projects... (press / to focus)" oninput="renderProjects(currentFilter)">
    <div class="export-bar">
      <button class="export-btn" onclick="exportProjects('json')">JSON</button>
      <button class="export-btn" onclick="exportProjects('csv')">CSV</button>
    </div>
  </div>

  <div class="filters" id="filters"></div>
  <div id="projects-list">
    <div class="empty-state">Loading...</div>
  </div>
</div>

<script src="utils.js"></script>
<script>
var allProjects = [];
var allTasks = [];
var currentFilter = 'all';

function exportProjects(format) {
  if (format === 'json') {
    LL.exportJSON(allProjects, 'life-long-projects.json');
  } else {
    LL.exportCSV(allProjects, [
      { key: 'id', label: 'ID' },
      { key: 'name', label: 'Name' },
      { key: 'status', label: 'Status' },
      { key: 'tags', label: 'Tags' },
      { key: 'created', label: 'Created' }
    ], 'life-long-projects.csv');
  }
}

function getProjectTaskCounts(projectId) {
  var total = 0, done = 0;
  allTasks.forEach(function(t) {
    if (t.project === projectId) {
      total++;
      if (t.status === 'done') done++;
    }
  });
  return { total: total, done: done };
}

function renderProjects(filter) {
  currentFilter = filter;
  var searchQuery = document.getElementById('search-input').value.trim();

  var filtered = allProjects;
  if (filter !== 'all') {
    filtered = allProjects.filter(function(p) { return (p.status || '').toLowerCase() === filter; });
  }
  if (searchQuery) {
    filtered = filtered.filter(function(p) {
      return LL.matchesSearch(p, searchQuery, ['name', 'id', 'tags', 'body', 'status']);
    });
  }

  document.querySelectorAll('.filter-btn').forEach(function(btn) {
    btn.classList.toggle('active', btn.dataset.filter === filter);
  });

  var list = document.getElementById('projects-list');
  if (filtered.length === 0) {
    list.innerHTML = '<div class="empty-state">No projects found.</div>';
    return;
  }

  list.innerHTML = filtered.map(function(p, i) {
    var tags = (p.tags || []).map(function(t) { return '<span class="tag">' + t + '</span>'; }).join('');
    var counts = getProjectTaskCounts(p.id);
    var taskInfo = counts.total > 0 ? counts.done + '/' + counts.total + ' tasks done' : 'No tasks';

    return '<div class="project-card" data-index="' + i + '">' +
      '<div class="project-header" onclick="toggleProject(this)">' +
        '<div class="project-info">' +
          '<div class="project-name">' + (p.name || p.id) + '</div>' +
          '<div class="project-meta">' +
            '<span class="badge ' + LL.badgeClass(p.status) + '">' + (p.status || 'unknown') + '</span>' +
            '<span class="project-task-count">' + taskInfo + '</span>' +
            '<span>Created ' + LL.formatDate(p.created) + '</span>' +
          '</div>' +
          (tags ? '<div class="project-tags">' + tags + '</div>' : '') +
        '</div>' +
        '<span class="project-toggle">&#9654;</span>' +
      '</div>' +
      '<div class="project-body">' +
        '<div class="project-body-content">' + (p.body || 'No description available.') + '</div>' +
      '</div>' +
    '</div>';
  }).join('');
}

function toggleProject(headerEl) {
  var card = headerEl.closest('.project-card');
  var body = card.querySelector('.project-body');
  var toggle = card.querySelector('.project-toggle');
  body.classList.toggle('open');
  toggle.classList.toggle('open');
}

async function loadProjects() {
  try {
    var res = await fetch('data/index.json');
    var data = await res.json();
    allProjects = data.projects || [];
    allTasks = data.tasks || [];

    document.getElementById('project-count').textContent = allProjects.length + ' project' + (allProjects.length !== 1 ? 's' : '');

    var statuses = {};
    allProjects.forEach(function(p) {
      var s = (p.status || 'unknown').toLowerCase();
      statuses[s] = (statuses[s] || 0) + 1;
    });

    var filtersHtml = '<button class="filter-btn active" data-filter="all" onclick="renderProjects(\'all\')">All (' + allProjects.length + ')</button>';
    Object.keys(statuses).forEach(function(s) {
      filtersHtml += '<button class="filter-btn" data-filter="' + s + '" onclick="renderProjects(\'' + s + '\')">' + s.charAt(0).toUpperCase() + s.slice(1) + ' (' + statuses[s] + ')</button>';
    });
    document.getElementById('filters').innerHTML = filtersHtml;

    renderProjects('all');
  } catch (err) {
    document.getElementById('projects-list').innerHTML = '<div class="empty-state" style="color:#f85149">Failed to load data. Make sure data/index.json exists.</div>';
    console.error('Failed to load projects:', err);
  }
}

loadProjects();
</script>
<script src="app.js"></script>
</body>
</html>
