<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Projects - Life Long</title>
<link rel="stylesheet" href="style.css">
<link rel="manifest" href="manifest.json">
<meta name="theme-color" content="#09090b">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700&display=swap" rel="stylesheet">
<script src="https://cdn.jsdelivr.net/npm/chart.js"></script>
<style>
.project-burndown {
  margin-top: 1rem;
  padding: 1rem;
  background: var(--bg-primary);
  border: 1px solid var(--border-secondary);
  border-radius: 8px;
}
.project-burndown h4,
.project-timeline h4 {
  margin: 0 0 0.75rem 0;
  font-size: 0.85rem;
  font-weight: 600;
  color: var(--text-secondary);
  text-transform: uppercase;
  letter-spacing: 0.05em;
}
.project-burndown canvas {
  width: 100% !important;
  max-height: 180px;
}
.project-timeline {
  margin-top: 1rem;
  padding: 1rem;
  background: var(--bg-primary);
  border: 1px solid var(--border-secondary);
  border-radius: 8px;
}
.project-timeline .timeline {
  margin-top: 0.5rem;
}
.project-timeline .no-activity {
  font-size: 0.85rem;
  color: var(--text-muted);
  font-style: italic;
}
</style>
</head>
<body>
<nav>
  <div class="brand">Life Long</div>
  <div class="links">
    <a href="index.html">Dashboard</a>
    <a href="projects.html" class="active">Projects</a>
    <a href="tasks.html">Tasks</a>
    <a href="logs.html">Logs</a>
    <a href="ideas.html">Ideas</a>
    <a href="goals.html">Goals</a>
    <a href="habits.html">Habits</a>
  </div>
</nav>

<div class="container">
  <div style="display:flex;justify-content:space-between;align-items:center;flex-wrap:wrap;gap:0.5rem">
    <div>
      <h1>Projects</h1>
      <p class="subtitle" id="project-count">Loading projects...</p>
    </div>
    <button class="page-action-btn" onclick="if(window.llShowAddModal)window.llShowAddModal('project')">+ Add Project</button>
  </div>

  <div class="search-bar">
    <input type="text" class="search-input" id="search-input" placeholder="Search projects... (press / to focus)" oninput="renderProjects(currentFilter)">
    <div class="export-bar">
      <button class="export-btn" onclick="exportProjects('json')">JSON</button>
      <button class="export-btn" onclick="exportProjects('csv')">CSV</button>
    </div>
  </div>

  <div class="filters" id="filters"></div>
  <div id="projects-list">
    <div class="empty-state">Loading...</div>
  </div>
</div>

<script src="utils.js"></script>
<script>
var allProjects = [];
var allTasks = [];
var currentFilter = 'all';
var burndownCharts = {};

function getThemeColor(varName) {
  return getComputedStyle(document.documentElement).getPropertyValue(varName).trim();
}

function exportProjects(format) {
  if (format === 'json') LL.exportJSON(allProjects, 'life-long-projects.json');
  else LL.exportCSV(allProjects, [
    { key: 'id', label: 'ID' }, { key: 'name', label: 'Name' }, { key: 'status', label: 'Status' },
    { key: 'tags', label: 'Tags' }, { key: 'created', label: 'Created' }
  ], 'life-long-projects.csv');
}

function getProjectTaskCounts(projectId) {
  var total = 0, done = 0;
  allTasks.forEach(function(t) { if (t.project === projectId) { total++; if (t.status === 'done') done++; } });
  return { total: total, done: done };
}

function getProjectTasks(projectId) {
  return allTasks.filter(function(t) { return t.project === projectId; });
}

function parseTimeSpent(ts) {
  if (!ts) return 0;
  var hours = 0;
  var hMatch = ts.match(/(\d+\.?\d*)h/);
  var mMatch = ts.match(/(\d+)m/);
  if (hMatch) hours += parseFloat(hMatch[1]);
  if (mMatch) hours += parseInt(mMatch[1]) / 60;
  return hours;
}

function getProjectTimeSpent(projectId) {
  var tasks = getProjectTasks(projectId);
  var totalHours = 0;
  tasks.forEach(function(t) { totalHours += parseTimeSpent(t.time_spent); });
  if (totalHours === 0) return '';
  return '<h4>Time Invested</h4><div class="time-total-value">' + totalHours + 'h total across ' + tasks.filter(function(t){return t.time_spent;}).length + ' tasks</div>';
}

function buildProjectTimelineHTML(projectId) {
  var tasks = getProjectTasks(projectId);
  if (tasks.length === 0) {
    return '<div class="no-activity">No task activity for this project.</div>';
  }

  // Sort by updated (or created) descending, take last 10
  var sorted = tasks.slice().sort(function(a, b) {
    var da = new Date(a.updated || a.created || 0);
    var db = new Date(b.updated || b.created || 0);
    return db - da;
  });
  var recent = sorted.slice(0, 10);

  var html = '<div class="timeline">';
  recent.forEach(function(t) {
    var dateStr = t.updated || t.created || '';
    var statusLabel = (t.status || 'unknown');
    var statusAction = '';
    if (statusLabel === 'done') statusAction = 'Completed';
    else if (statusLabel === 'in-progress') statusAction = 'In progress';
    else if (statusLabel === 'todo') statusAction = 'Created';
    else statusAction = statusLabel.charAt(0).toUpperCase() + statusLabel.slice(1);

    html += '<div class="timeline-item type-task">' +
      '<div class="timeline-date">' + LL.formatDate(dateStr) + '</div>' +
      '<div class="timeline-content">' +
        '<div class="tl-title">' + (t.title || t.id) + '</div>' +
        '<div class="tl-body">' + statusAction + ' &middot; ' + (t.tags || []).join(', ') + '</div>' +
      '</div>' +
    '</div>';
  });
  html += '</div>';
  return html;
}

function renderProjects(filter) {
  currentFilter = filter;
  var searchQuery = document.getElementById('search-input').value.trim();
  var filtered = allProjects;
  if (filter !== 'all') filtered = allProjects.filter(function(p) { return (p.status || '').toLowerCase() === filter; });
  if (searchQuery) filtered = filtered.filter(function(p) { return LL.matchesSearch(p, searchQuery, ['name', 'id', 'tags', 'body', 'status']); });

  document.querySelectorAll('.filter-btn').forEach(function(btn) { btn.classList.toggle('active', btn.dataset.filter === filter); });

  var list = document.getElementById('projects-list');
  if (filtered.length === 0) { list.innerHTML = '<div class="empty-state">No projects found.</div>'; return; }

  // Destroy existing burndown charts before re-rendering
  Object.keys(burndownCharts).forEach(function(key) {
    if (burndownCharts[key]) {
      burndownCharts[key].destroy();
      delete burndownCharts[key];
    }
  });

  list.innerHTML = filtered.map(function(p, i) {
    var tags = (p.tags || []).map(function(t) { return '<span class="tag">' + t + '</span>'; }).join('');
    var counts = getProjectTaskCounts(p.id);
    var taskInfo = counts.total > 0 ? counts.done + '/' + counts.total + ' tasks done' : 'No tasks';
    var progressHtml = LL.progressBarHTML(counts.done, counts.total);
    var trend = LL.weeklyCompletionTrend(allTasks.filter(function(t) { return t.project === p.id; }));
    var sparkHtml = LL.sparklineSVG(trend, 60, 16);
    var projectTimeTotalHrs = 0;
    getProjectTasks(p.id).forEach(function(t) { projectTimeTotalHrs += parseTimeSpent(t.time_spent); });
    var timeHtml = projectTimeTotalHrs > 0 ? '<span class="time-badge">' + projectTimeTotalHrs + 'h invested</span>' : '';

    var canvasId = 'burndown-' + p.id;
    var timelineHtml = buildProjectTimelineHTML(p.id);

    return '<div class="project-card" data-index="' + i + '" data-project-id="' + p.id + '">' +
      '<div class="project-header" onclick="toggleProject(this)">' +
        '<div class="project-info">' +
          '<div class="project-name">' + (p.name || p.id) + '</div>' +
          '<div class="project-meta">' +
            '<span class="badge ' + LL.badgeClass(p.status) + '">' + (p.status || 'unknown') + '</span>' +
            '<span class="project-task-count">' + taskInfo + '</span>' +
            timeHtml +
            (sparkHtml ? '<span>' + sparkHtml + '</span>' : '') +
            '<span>Created ' + LL.formatDate(p.created) + '</span>' +
          '</div>' +
          (tags ? '<div class="project-tags">' + tags + '</div>' : '') +
          progressHtml +
        '</div>' +
        '<span class="project-toggle">&#9654;</span>' +
      '</div>' +
      '<div class="project-body">' +
        '<div class="project-body-content">' + LL.renderMarkdown(p.body || 'No description available.') + '</div>' +
        '<div class="project-time-total">' + getProjectTimeSpent(p.id) + '</div>' +
        '<div class="project-burndown">' +
          '<h4>Burndown (30 days)</h4>' +
          '<canvas id="' + canvasId + '" height="180"></canvas>' +
        '</div>' +
        '<div class="project-timeline">' +
          '<h4>Recent Activity</h4>' +
          timelineHtml +
        '</div>' +
        (window.llProjectActions ? window.llProjectActions(p.id) : '') +
      '</div>' +
    '</div>';
  }).join('');

  // Initialize burndown charts after DOM is rendered
  initProjectBurndownCharts(filtered);
}

function initProjectBurndownCharts(projects) {
  var textMuted = getThemeColor('--text-muted') || '#8b949e';
  var gridColor = getThemeColor('--chart-grid') || '#21262d';
  var accentGreen = getThemeColor('--accent-green-text') || '#3fb950';
  var accentBlue = getThemeColor('--accent-blue') || '#58a6ff';
  var bgSecondary = getThemeColor('--bg-secondary') || '#161b22';
  var textPrimary = getThemeColor('--text-primary') || '#f0f6fc';
  var textSecondary = getThemeColor('--text-secondary') || '#c9d1d9';
  var borderPrimary = getThemeColor('--border-primary') || '#30363d';

  var today = new Date();
  today.setHours(0, 0, 0, 0);

  projects.forEach(function(p) {
    var canvasId = 'burndown-' + p.id;
    var canvasEl = document.getElementById(canvasId);
    if (!canvasEl) return;

    var projectTasks = getProjectTasks(p.id);
    var labels = [];
    var completedCumulative = [];
    var createdCumulative = [];
    var totalCompleted = 0;
    var totalCreated = 0;

    for (var d = 29; d >= 0; d--) {
      var date = new Date(today);
      date.setDate(date.getDate() - d);
      var dateStr = LL.toLocalDateStr(date);
      labels.push(dateStr);

      var dayCompleted = 0;
      var dayCreated = 0;

      projectTasks.forEach(function(t) {
        var updated = (t.updated || t.created || '').split('T')[0];
        var created = (t.created || '').split('T')[0];
        if (t.status === 'done' && updated === dateStr) dayCompleted++;
        if (created === dateStr) dayCreated++;
      });

      totalCompleted += dayCompleted;
      totalCreated += dayCreated;
      completedCumulative.push(totalCompleted);
      createdCumulative.push(totalCreated);
    }

    var ctx = canvasEl.getContext('2d');
    burndownCharts[p.id] = new Chart(ctx, {
      type: 'line',
      data: {
        labels: labels.map(function(l) {
          var parts = l.split('-');
          return parts[1] + '/' + parts[2];
        }),
        datasets: [
          {
            label: 'Created (cumulative)',
            data: createdCumulative,
            borderColor: accentBlue,
            backgroundColor: accentBlue + '20',
            fill: true,
            tension: 0.3,
            pointRadius: 0,
            pointHoverRadius: 4,
            borderWidth: 2
          },
          {
            label: 'Completed (cumulative)',
            data: completedCumulative,
            borderColor: accentGreen,
            backgroundColor: accentGreen + '20',
            fill: true,
            tension: 0.3,
            pointRadius: 0,
            pointHoverRadius: 4,
            borderWidth: 2
          }
        ]
      },
      options: {
        responsive: true,
        maintainAspectRatio: true,
        interaction: {
          mode: 'index',
          intersect: false
        },
        scales: {
          y: {
            beginAtZero: true,
            ticks: {
              color: textMuted,
              stepSize: 1
            },
            grid: { color: gridColor }
          },
          x: {
            ticks: {
              color: textMuted,
              maxRotation: 0,
              autoSkip: true,
              maxTicksLimit: 8
            },
            grid: { display: false }
          }
        },
        plugins: {
          legend: {
            position: 'bottom',
            labels: {
              color: textMuted,
              padding: 12,
              usePointStyle: true,
              font: { size: 11 }
            }
          },
          tooltip: {
            backgroundColor: bgSecondary,
            titleColor: textPrimary,
            bodyColor: textSecondary,
            borderColor: borderPrimary,
            borderWidth: 1
          }
        }
      }
    });
  });
}

function toggleProject(headerEl) {
  var card = headerEl.closest('.project-card');
  var body = card.querySelector('.project-body');
  var toggle = card.querySelector('.project-toggle');
  body.classList.toggle('open');
  toggle.classList.toggle('open');
}

async function loadProjects() {
  try {
    var res = await fetch('data/index.json?t=' + Date.now());
    var data = await res.json();
    allProjects = data.projects || [];
    allTasks = data.tasks || [];

    document.getElementById('project-count').textContent = allProjects.length + ' project' + (allProjects.length !== 1 ? 's' : '');

    var statuses = {};
    allProjects.forEach(function(p) { var s = (p.status || 'unknown').toLowerCase(); statuses[s] = (statuses[s] || 0) + 1; });
    var filtersHtml = '<button class="filter-btn active" data-filter="all" onclick="renderProjects(\'all\')">All (' + allProjects.length + ')</button>';
    Object.keys(statuses).forEach(function(s) {
      filtersHtml += '<button class="filter-btn" data-filter="' + s + '" onclick="renderProjects(\'' + s + '\')">' + s.charAt(0).toUpperCase() + s.slice(1) + ' (' + statuses[s] + ')</button>';
    });
    document.getElementById('filters').innerHTML = filtersHtml;

    renderProjects('all');
  } catch (err) {
    document.getElementById('projects-list').innerHTML = '<div class="empty-state" style="color:var(--accent-red)">Failed to load data.</div>';
    console.error('Failed to load projects:', err);
  }
}

loadProjects();
</script>
<script src="app.js"></script>
</body>
</html>
