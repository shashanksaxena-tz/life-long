<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Ideas - Life Long</title>
<style>
*, *::before, *::after { box-sizing: border-box; margin: 0; padding: 0; }
body { background: #0d1117; color: #c9d1d9; font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', Helvetica, Arial, sans-serif; line-height: 1.6; }
a { color: #58a6ff; text-decoration: none; }
a:hover { text-decoration: underline; }

/* Navigation */
nav { background: #161b22; border-bottom: 1px solid #30363d; padding: 0.75rem 1.5rem; display: flex; align-items: center; gap: 2rem; position: sticky; top: 0; z-index: 100; }
nav .brand { font-size: 1.2rem; font-weight: 700; color: #f0f6fc; }
nav .links { display: flex; gap: 1.25rem; flex-wrap: wrap; }
nav .links a { color: #c9d1d9; font-size: 0.9rem; padding: 0.25rem 0.5rem; border-radius: 6px; transition: background 0.15s; }
nav .links a:hover, nav .links a.active { background: #21262d; color: #f0f6fc; text-decoration: none; }

/* Layout */
.container { max-width: 1200px; margin: 0 auto; padding: 1.5rem; }
h1 { font-size: 1.75rem; color: #f0f6fc; margin-bottom: 0.5rem; }
.subtitle { color: #8b949e; margin-bottom: 1.5rem; font-size: 0.95rem; }

/* Badges */
.badge { display: inline-block; padding: 0.15rem 0.6rem; border-radius: 12px; font-size: 0.75rem; font-weight: 600; text-transform: capitalize; }
.badge-done, .badge-active { background: #23863620; color: #3fb950; border: 1px solid #23863640; }
.badge-in-progress { background: #d2992220; color: #d29922; border: 1px solid #d2992240; }
.badge-todo { background: #8b949e20; color: #8b949e; border: 1px solid #8b949e40; }
.badge-planning { background: #1f6feb20; color: #58a6ff; border: 1px solid #1f6feb40; }
.badge-raw { background: #8957e520; color: #bc8cff; border: 1px solid #8957e540; }

/* Tags */
.tag { display: inline-block; padding: 0.1rem 0.5rem; background: #388bfd20; color: #58a6ff; border-radius: 12px; font-size: 0.7rem; margin: 0.15rem 0.15rem 0.15rem 0; border: 1px solid #388bfd40; }

/* Ideas Grid */
.ideas-grid { display: grid; grid-template-columns: repeat(auto-fill, minmax(340px, 1fr)); gap: 1rem; }

/* Idea Card */
.idea-card { background: #161b22; border: 1px solid #30363d; border-radius: 8px; padding: 1.25rem; transition: border-color 0.15s; display: flex; flex-direction: column; }
.idea-card:hover { border-color: #484f58; }
.idea-header { display: flex; justify-content: space-between; align-items: flex-start; margin-bottom: 0.75rem; gap: 0.5rem; }
.idea-id { font-size: 0.8rem; color: #8b949e; font-family: monospace; }
.idea-date { font-size: 0.8rem; color: #8b949e; }
.idea-body { font-size: 0.9rem; line-height: 1.7; flex: 1; margin-bottom: 0.75rem; }
.idea-body p { margin-bottom: 0.5rem; }
.idea-body h1, .idea-body h2, .idea-body h3 { color: #f0f6fc; margin: 0.75rem 0 0.4rem; }
.idea-body h1 { font-size: 1.2rem; }
.idea-body h2 { font-size: 1.1rem; }
.idea-body h3 { font-size: 1rem; }
.idea-body ul, .idea-body ol { margin: 0.4rem 0 0.5rem 1.5rem; }
.idea-body li { margin-bottom: 0.2rem; }
.idea-body code { background: #21262d; padding: 0.1rem 0.35rem; border-radius: 4px; font-size: 0.85em; color: #f0f6fc; }
.idea-body pre { background: #0d1117; border: 1px solid #30363d; border-radius: 6px; padding: 0.75rem; overflow-x: auto; margin: 0.5rem 0; }
.idea-body pre code { background: none; padding: 0; }
.idea-body blockquote { border-left: 3px solid #30363d; padding-left: 0.75rem; color: #8b949e; margin: 0.5rem 0; }
.idea-body strong { color: #f0f6fc; }
.idea-footer { display: flex; gap: 0.5rem; align-items: center; flex-wrap: wrap; border-top: 1px solid #21262d; padding-top: 0.75rem; margin-top: auto; }

/* Filters */
.filters { display: flex; gap: 0.75rem; margin-bottom: 1.5rem; flex-wrap: wrap; align-items: center; }
.filter-btn { background: #21262d; color: #c9d1d9; border: 1px solid #30363d; padding: 0.35rem 0.85rem; border-radius: 6px; cursor: pointer; font-size: 0.85rem; transition: all 0.15s; }
.filter-btn:hover { border-color: #58a6ff; color: #f0f6fc; }
.filter-btn.active { background: #1f6feb; border-color: #1f6feb; color: #fff; }
.filter-select { background: #21262d; color: #c9d1d9; border: 1px solid #30363d; padding: 0.35rem 0.6rem; border-radius: 6px; font-size: 0.85rem; cursor: pointer; }
.filter-select:focus { border-color: #58a6ff; outline: none; }
.filter-row { display: flex; gap: 0.5rem; align-items: center; }
.filters label { font-size: 0.85rem; color: #8b949e; }

/* Empty state */
.empty-state { text-align: center; padding: 3rem; color: #8b949e; }

/* Responsive */
@media (max-width: 768px) {
  nav { flex-direction: column; gap: 0.5rem; align-items: flex-start; }
  .ideas-grid { grid-template-columns: 1fr; }
}
</style>
</head>
<body>
<nav>
  <div class="brand">Life Long</div>
  <div class="links">
    <a href="index.html">Dashboard</a>
    <a href="projects.html">Projects</a>
    <a href="tasks.html">Tasks</a>
    <a href="logs.html">Logs</a>
    <a href="ideas.html" class="active">Ideas</a>
  </div>
</nav>

<div class="container">
  <h1>Ideas</h1>
  <p class="subtitle" id="idea-count">Loading ideas...</p>

  <div class="filters" id="status-filters"></div>

  <div class="filters">
    <div class="filter-row">
      <label>Tag:</label>
      <select class="filter-select" id="tag-filter" onchange="applyFilters()">
        <option value="all">All Tags</option>
      </select>
    </div>
  </div>

  <div class="ideas-grid" id="ideas-list">
    <div class="empty-state">Loading...</div>
  </div>
</div>

<script>
var allIdeas = [];
var currentStatusFilter = 'all';

function formatDate(dateStr) {
  if (!dateStr) return '';
  var d = new Date(dateStr);
  if (isNaN(d)) return dateStr;
  return d.toLocaleDateString('en-US', { year: 'numeric', month: 'short', day: 'numeric' });
}

function badgeClass(status) {
  if (!status) return 'badge-raw';
  var s = status.toLowerCase().replace(/\s+/g, '-');
  if (s === 'done' || s === 'active') return 'badge-done';
  if (s === 'in-progress') return 'badge-in-progress';
  if (s === 'planning') return 'badge-planning';
  if (s === 'raw') return 'badge-raw';
  if (s === 'todo') return 'badge-todo';
  return 'badge-raw';
}

// Simple markdown renderer
function renderMarkdown(text) {
  if (!text) return '';
  var html = text;

  // Escape HTML
  html = html.replace(/&/g, '&amp;').replace(/</g, '&lt;').replace(/>/g, '&gt;');

  // Code blocks
  html = html.replace(/```(\w*)\n([\s\S]*?)```/g, function(m, lang, code) {
    return '<pre><code>' + code.trim() + '</code></pre>';
  });

  // Inline code
  html = html.replace(/`([^`]+)`/g, '<code>$1</code>');

  // Headers
  html = html.replace(/^#### (.+)$/gm, '<h4>$1</h4>');
  html = html.replace(/^### (.+)$/gm, '<h3>$1</h3>');
  html = html.replace(/^## (.+)$/gm, '<h2>$1</h2>');
  html = html.replace(/^# (.+)$/gm, '<h1>$1</h1>');

  // Bold and italic
  html = html.replace(/\*\*\*(.+?)\*\*\*/g, '<strong><em>$1</em></strong>');
  html = html.replace(/\*\*(.+?)\*\*/g, '<strong>$1</strong>');
  html = html.replace(/\*(.+?)\*/g, '<em>$1</em>');

  // Links
  html = html.replace(/\[([^\]]+)\]\(([^)]+)\)/g, '<a href="$2" target="_blank">$1</a>');

  // Blockquotes
  html = html.replace(/^&gt; (.+)$/gm, '<blockquote>$1</blockquote>');

  // Unordered lists
  html = html.replace(/^[\s]*[-*] (.+)$/gm, '<li>$1</li>');
  html = html.replace(/(<li>[\s\S]*?<\/li>)/g, function(match) {
    if (match.indexOf('<ul>') === -1) {
      return '<ul>' + match + '</ul>';
    }
    return match;
  });
  html = html.replace(/<\/ul>\s*<ul>/g, '');

  // Paragraphs
  var lines = html.split('\n');
  var result = [];
  var inBlock = false;
  for (var i = 0; i < lines.length; i++) {
    var line = lines[i].trim();
    if (line.match(/^<(h[1-6]|ul|ol|li|pre|blockquote|hr|div)/)) {
      inBlock = true;
      result.push(line);
    } else if (line.match(/^<\/(ul|ol|pre|blockquote|div)/)) {
      inBlock = false;
      result.push(line);
    } else if (line === '') {
      result.push('');
    } else if (!inBlock && !line.match(/^<\//)) {
      result.push('<p>' + line + '</p>');
    } else {
      result.push(line);
    }
  }
  return result.join('\n');
}

function setStatusFilter(filter) {
  currentStatusFilter = filter;
  document.querySelectorAll('#status-filters .filter-btn').forEach(function(btn) {
    btn.classList.toggle('active', btn.dataset.filter === filter);
  });
  applyFilters();
}

function applyFilters() {
  var statusFilter = currentStatusFilter;
  var tagFilter = document.getElementById('tag-filter').value;

  var filtered = allIdeas.filter(function(idea) {
    if (statusFilter !== 'all' && (idea.status || 'raw').toLowerCase() !== statusFilter) return false;
    if (tagFilter !== 'all' && (idea.tags || []).indexOf(tagFilter) === -1) return false;
    return true;
  });

  renderIdeas(filtered);
}

function renderIdeas(ideas) {
  var list = document.getElementById('ideas-list');
  if (ideas.length === 0) {
    list.innerHTML = '<div class="empty-state">No ideas match the current filters.</div>';
    return;
  }

  list.innerHTML = ideas.map(function(idea) {
    var tags = (idea.tags || []).map(function(t) { return '<span class="tag">' + t + '</span>'; }).join('');
    return '<div class="idea-card">' +
      '<div class="idea-header">' +
        '<span class="idea-id">' + (idea.id || '') + '</span>' +
        '<span class="idea-date">' + formatDate(idea.created) + '</span>' +
      '</div>' +
      '<div class="idea-body">' + renderMarkdown(idea.body) + '</div>' +
      '<div class="idea-footer">' +
        '<span class="badge ' + badgeClass(idea.status) + '">' + (idea.status || 'raw') + '</span>' +
        tags +
      '</div>' +
    '</div>';
  }).join('');
}

async function loadIdeas() {
  try {
    var res = await fetch('data/index.json');
    var data = await res.json();
    allIdeas = data.ideas || [];

    // Sort by created date descending
    allIdeas.sort(function(a, b) { return new Date(b.created) - new Date(a.created); });

    document.getElementById('idea-count').textContent = allIdeas.length + ' idea' + (allIdeas.length !== 1 ? 's' : '');

    // Build status filters
    var statuses = {};
    allIdeas.forEach(function(idea) {
      var s = (idea.status || 'raw').toLowerCase();
      statuses[s] = (statuses[s] || 0) + 1;
    });
    var filtersHtml = '<button class="filter-btn active" data-filter="all" onclick="setStatusFilter(\'all\')">All (' + allIdeas.length + ')</button>';
    Object.keys(statuses).forEach(function(s) {
      filtersHtml += '<button class="filter-btn" data-filter="' + s + '" onclick="setStatusFilter(\'' + s + '\')">' + s.charAt(0).toUpperCase() + s.slice(1) + ' (' + statuses[s] + ')</button>';
    });
    document.getElementById('status-filters').innerHTML = filtersHtml;

    // Build tag filter dropdown
    var tags = {};
    allIdeas.forEach(function(idea) { (idea.tags || []).forEach(function(t) { tags[t] = true; }); });
    var tagSelect = document.getElementById('tag-filter');
    Object.keys(tags).sort().forEach(function(tag) {
      var opt = document.createElement('option');
      opt.value = tag;
      opt.textContent = tag;
      tagSelect.appendChild(opt);
    });

    applyFilters();
  } catch (err) {
    document.getElementById('ideas-list').innerHTML = '<div class="empty-state" style="color:#f85149">Failed to load data. Make sure data/index.json exists.</div>';
    console.error('Failed to load ideas:', err);
  }
}

loadIdeas();
</script>
</body>
</html>
