<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Ideas - Life Long</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700&display=swap" rel="stylesheet">
<link rel="stylesheet" href="style.css">
<link rel="manifest" href="manifest.json">
<meta name="theme-color" content="#09090b">
</head>
<body>
<nav>
  <div class="brand">Life Long</div>
  <div class="links">
    <a href="index.html">Dashboard</a>
    <a href="projects.html">Projects</a>
    <a href="tasks.html">Tasks</a>
    <a href="logs.html">Logs</a>
    <a href="ideas.html" class="active">Ideas</a>
    <a href="goals.html">Goals</a>
    <a href="habits.html">Habits</a>
  </div>
</nav>

<div class="container">
  <div style="display:flex;justify-content:space-between;align-items:center;flex-wrap:wrap;gap:0.5rem">
    <div>
      <h1>Ideas</h1>
      <p class="subtitle" id="idea-count">Loading ideas...</p>
    </div>
    <button class="page-action-btn" onclick="if(window.llShowAddModal)window.llShowAddModal('idea')">+ Add Idea</button>
  </div>

  <div class="search-bar">
    <input type="text" class="search-input" id="search-input" placeholder="Search ideas... (press / to focus)" oninput="applyFilters()">
    <div class="export-bar">
      <button class="export-btn" onclick="exportIdeas('json')">JSON</button>
      <button class="export-btn" onclick="exportIdeas('csv')">CSV</button>
    </div>
  </div>

  <div class="filters" id="status-filters"></div>

  <div class="filters">
    <div class="filter-row">
      <label>Tag:</label>
      <select class="filter-select" id="tag-filter" onchange="applyFilters()">
        <option value="all">All Tags</option>
      </select>
    </div>
  </div>

  <div class="ideas-grid" id="ideas-list">
    <div class="empty-state">Loading...</div>
  </div>
</div>

<script src="utils.js"></script>
<script>
var allIdeas = [];
var currentStatusFilter = 'all';

function exportIdeas(format) {
  if (format === 'json') {
    LL.exportJSON(allIdeas, 'life-long-ideas.json');
  } else {
    LL.exportCSV(allIdeas, [
      { key: 'id', label: 'ID' },
      { key: 'status', label: 'Status' },
      { key: 'tags', label: 'Tags' },
      { key: 'body', label: 'Content' },
      { key: 'created', label: 'Created' }
    ], 'life-long-ideas.csv');
  }
}

function setStatusFilter(filter) {
  currentStatusFilter = filter;
  document.querySelectorAll('#status-filters .filter-btn').forEach(function(btn) {
    btn.classList.toggle('active', btn.dataset.filter === filter);
  });
  applyFilters();
}

function applyFilters() {
  var statusFilter = currentStatusFilter;
  var tagFilter = document.getElementById('tag-filter').value;
  var searchQuery = document.getElementById('search-input').value.trim();

  var filtered = allIdeas.filter(function(idea) {
    if (statusFilter !== 'all' && (idea.status || 'raw').toLowerCase() !== statusFilter) return false;
    if (tagFilter !== 'all' && (idea.tags || []).indexOf(tagFilter) === -1) return false;
    if (searchQuery && !LL.matchesSearch(idea, searchQuery, ['body', 'id', 'tags', 'status'])) return false;
    return true;
  });

  renderIdeas(filtered);
}

function renderIdeas(ideas) {
  var list = document.getElementById('ideas-list');
  if (ideas.length === 0) {
    list.innerHTML = '<div class="empty-state">No ideas match the current filters.</div>';
    return;
  }

  list.innerHTML = ideas.map(function(idea) {
    var tags = (idea.tags || []).map(function(t) { return '<span class="tag">' + t + '</span>'; }).join('');
    return '<div class="idea-card">' +
      '<div class="idea-header">' +
        '<span class="idea-id">' + (idea.id || '') + '</span>' +
        '<span class="idea-date">' + LL.formatDate(idea.created) + '</span>' +
      '</div>' +
      '<div class="idea-body">' + LL.renderMarkdown(idea.body) + '</div>' +
      '<div class="idea-footer">' +
        '<span class="badge ' + LL.badgeClass(idea.status || 'raw') + '">' + (idea.status || 'raw') + '</span>' +
        tags +
      '</div>' +
      (window.llIdeaActions ? window.llIdeaActions(idea.id) : '') +
    '</div>';
  }).join('');
}

async function loadIdeas() {
  try {
    var res = await fetch('data/index.json');
    var data = await res.json();
    allIdeas = data.ideas || [];

    allIdeas.sort(function(a, b) { return new Date(b.created) - new Date(a.created); });

    document.getElementById('idea-count').textContent = allIdeas.length + ' idea' + (allIdeas.length !== 1 ? 's' : '');

    var statuses = {};
    allIdeas.forEach(function(idea) {
      var s = (idea.status || 'raw').toLowerCase();
      statuses[s] = (statuses[s] || 0) + 1;
    });
    var filtersHtml = '<button class="filter-btn active" data-filter="all" onclick="setStatusFilter(\'all\')">All (' + allIdeas.length + ')</button>';
    Object.keys(statuses).forEach(function(s) {
      filtersHtml += '<button class="filter-btn" data-filter="' + s + '" onclick="setStatusFilter(\'' + s + '\')">' + s.charAt(0).toUpperCase() + s.slice(1) + ' (' + statuses[s] + ')</button>';
    });
    document.getElementById('status-filters').innerHTML = filtersHtml;

    var tags = {};
    allIdeas.forEach(function(idea) { (idea.tags || []).forEach(function(t) { tags[t] = true; }); });
    var tagSelect = document.getElementById('tag-filter');
    Object.keys(tags).sort().forEach(function(tag) {
      var opt = document.createElement('option');
      opt.value = tag;
      opt.textContent = tag;
      tagSelect.appendChild(opt);
    });

    applyFilters();
  } catch (err) {
    document.getElementById('ideas-list').innerHTML = '<div class="empty-state" style="color:var(--accent-red)">Failed to load data. Make sure data/index.json exists.</div>';
    console.error('Failed to load ideas:', err);
  }
}

loadIdeas();
</script>
<script src="app.js"></script>
</body>
</html>
